name: Application checks
on:
  push:
    branches: [main]
    paths-ignore: ["artifacts/**"]
  pull_request:
    paths-ignore: ["artifacts/**"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
